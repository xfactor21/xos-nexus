[package]
name = "app"
version = "0.3.0"
description = "xOS: neXus — the operating system for makers who think faster than they organize."
authors = ["xOS: neXus"]
license = ""
repository = "https://github.com/xfactor21/xos-nexus"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# "unstable" gates Window::add_child — Room A (Web Browser) embeds a real
# native child webview inside the room's viewport instead of an <iframe>,
# which is the only way to load arbitrary external sites without hitting
# X-Frame-Options/frame-ancestors blocks (see lib.rs browser-view commands).
tauri = { version = "2.11.3", features = ["tray-icon", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
# Terminal (.py) / Browser (.html) file editing: native open/save dialogs
# plus reading/writing whatever path the user picks through them. Paths are
# always user-chosen via the OS dialog, never accepted as free-form input
# from JS, so an open filesystem scope here doesn't widen what untrusted
# content could reach — same posture as the browser-view webview getting no
# IPC permissions at all.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# "Open externally" — the Browser room's fallback for a site whose
# X-Frame-Options/CSP genuinely blocks embedding even in the native child
# webview, plus the Terminal room's "open my dev server in the real system
# browser" affordance. A real OS-level "open this URL/path with the default
# handler" call, not window.open() (which Tauri's webview intercepts as an
# in-app navigation rather than launching the OS browser).
tauri-plugin-opener = "2"
# Knowledge Matrix "ADD TO MATRIX": a server-side (Rust-process) HTTP fetch
# of the current page for offline snapshotting — deliberately NOT scraped
# out of the live embedded browser-view webview, since that would require
# exposing Tauri's IPC bridge to arbitrary untrusted remote page JS.
# rustls-tls avoids a system OpenSSL dependency.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.20"
